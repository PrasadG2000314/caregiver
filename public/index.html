<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Budget Dekoo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #059669;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .brand {
      margin-top: 16px;
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
    }
    .tagline {
      margin-top: 4px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
  <script>
    // In live or hybrid web view, redirect to application root
    window.location.replace('/');
  </script>
</head>
<body>
  <div class="loader"></div>
  <div class="brand">Budget Dekoo</div>
  <div class="tagline">Malaysia Caregiver Network</div>
</body>
</html>
